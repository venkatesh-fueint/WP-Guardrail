name: WordPress Coding Standards Check

on:
  push:
    branches: ["**"]

jobs:
  phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install dependencies
        run: composer install

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --standard=phpcs.xml